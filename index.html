<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geek Squad Invoice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        /* Button to open popup */
        .open-btn { background: #0046be; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Overlay */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        
        /* Popup Box */
        .popup { background: white; width: 100%; max-width: 450px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Header */
        .popup-header { background: #0046be; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-text h2 { font-size: 20px; font-weight: 700; }
        .header-text p { font-size: 13px; opacity: 0.9; }
        .close-btn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; line-height: 1; }
        
        /* Body */
        .popup-body { padding: 30px; }
        .status-badge { display: inline-block; background: #e6f4ea; color: #137333; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 20px; }
        
        .invoice-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 15px; color: #333; }
        .invoice-row span:first-child { color: #555; }
        .invoice-row span:last-child { font-weight: 600; }
        
        .total-section { background: #f8f9fa; margin: 20px -30px -30px -30px; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; }
        .total-label { font-size: 18px; font-weight: 700; color: #333; }
        .total-amount { font-size: 28px; font-weight: 800; color: #0046be; }
        
        /* Support Box */
        .support-box { margin-top: 25px; text-align: center; background: #eef4ff; padding: 15px; border-radius: 8px; border: 1px solid #cce0ff; }
        .support-box p { font-size: 14px; color: #333; margin-bottom: 5px; }
        .phone-number { font-size: 20px !important; font-weight: 700 !important; color: #0046be !important; text-decoration: none; display: block; }
        
        .print-btn { width: 100%; background: #0046be; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .print-btn:hover { background: #003a9e; }

    </style>
</head>
<body>

    <button class="open-btn" onclick="openPopup()">View Geek Squad Invoice</button>

    <!-- Invoice Popup -->
    <div class="overlay" id="invoiceOverlay">
        <div class="popup">
            <div class="popup-header">
                <div class="header-text">
                    <h2>Geek Squad Invoice</h2>
                    <p>Invoice #GS-2023-987654</p>
                </div>
                <button class="close-btn" onclick="closePopup()">&times;</button>
            </div>
            
            <div class="popup-body">
                <div class="status-badge">PAID / COMPLETED</div>
                
                <div class="invoice-row">
                    <span>Date:</span>
                    <span>October 24, 2023</span>
                </div>
                <div class="invoice-row">
                    <span>Customer:</span>
                    <span>Valued Customer</span>
                </div>
                <div class="invoice-row">
                    <span>Service:</span>
                    <span>Tech Support & Protection Plan</span>
                </div>
                <div class="invoice-row">
                    <span>Duration:</span>
                    <span>1 Year Subscription</span>
                </div>

                <div class="total-section">
                    <span class="total-label">Total Amount:</span>
                    <span class="total-amount">$765.00</span>
                </div>

                <div class="support-box">
                    <p>Questions about this invoice? Call our support team:</p>
                    <a href="tel:+90762676509" class="phone-number">📞 +90 762676509</a>
                </div>

                <button class="print-btn" onclick="window.print()">Print Receipt</button>
            </div>
        </div>
    </div>

    <script>
        let isPlaying = false;
        let keepAliveInterval;

        // --- POPUP CONTROLS ---
        function openPopup() {
            document.getElementById("invoiceOverlay").style.display = "flex";
            startSound(); // Start the voice when popup opens
        }

        function closePopup() {
            document.getElementById("invoiceOverlay").style.display = "none";
            stopSound(); // Stop the voice when popup X is clicked
        }

        // --- SOUND EFFECT CONTROLS ---
        function startSound() {
            if (isPlaying) return; 
            isPlaying = true;

            // Chrome bug fix: pause and resume every 5 seconds so it doesn't cut off
            keepAliveInterval = setInterval(function() {
                if (!isPlaying) return;
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.pause();
                    window.speechSynthesis.resume();
                }
            }, 5000);

            function speak() {
                if (!isPlaying) return;

                // Text changed to exactly what you requested
                const text = "Good luck, good luck.";
                const utterance = new SpeechSynthesisUtterance(text);
                
                utterance.rate = 1.0; 
                utterance.pitch = 1;

                // When the voice finishes, say it again
                utterance.onend = function() {
                    if (isPlaying) {
                        speak(); // Repeat
                    }
                };

                window.speechSynthesis.speak(utterance);
            }

            speak(); // Start the first time
        }

        function stopSound() {
            isPlaying = false; // Stop the loop
            clearInterval(keepAliveInterval); // Stop the bug fix timer
            window.speechSynthesis.cancel(); // Stop any current speaking immediately
        }
    </script>

</body>
</html>
